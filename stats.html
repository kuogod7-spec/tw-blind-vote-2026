  <script>
    // 由資料檔即時計算統計數字，確保統計頁與實際資料一致
    (() => {
      const D = window.ELECTION_DATA, F = window.FEASIBILITY || {};
      const $ = (k) => document.querySelector(`[data-stat="${k}"]`);
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const LV = { high: "高", medium: "中", low: "低", unclear: "資訊不足" };
      const sum = (a) => a.reduce((x, y) => x + y, 0);
      const dist = (o) => Object.keys(LV).filter((k) => o[k]).map((k) => `${LV[k]} ${o[k]}`).join("、") || "—";

      $("updated").textContent = D.meta.updated;

      const tot = { races: 0, cands: 0, plat: 0, feas: 0, empty: 0 };
      const longByRace = [];
      const regions = new Map();
      D.races.forEach((race) => {
        const cs = race.candidates;
        const plat = cs.map((c) => c.platforms.length);
        const rec = cs.map((c) => c.record.length);
        const past = cs.map((c) => (c.past || []).reduce((n, r) => n + r.promises.length, 0));
        const all = cs.flatMap((c) => [...c.platforms, ...c.record, ...(c.past || []).flatMap((r) => r.promises)]);
        const withSrc = all.filter((x) => x.source).length;
        const self = cs.flatMap((c) => c.record).filter((r) => /本人說法/.test(r.text)).length;
        const feas = {}, longs = [];
        let feasN = 0;
        cs.forEach((c) => c.platforms.forEach((p, i) => {
          const f = F[`${c.id}-p${i}`];
          if (!f) return;
          feasN++;
          feas[f.level] = (feas[f.level] || 0) + 1;
          if (f.track === "long") longs.push(p.title);
        }));
        if (longs.length) longByRace.push({ name: `${race.region} ${race.office}`, longs });
        tot.races++; tot.cands += cs.length; tot.plat += sum(plat); tot.feas += feasN;
        tot.empty += plat.filter((n) => !n).length;
        const range = (a) => `${sum(a)}（每人 ${Math.min(...a)}–${Math.max(...a)}）`;
        const html = `
          <h3>${esc(race.office)}</h3>
          <table class="def">
            <tr><th>候選人</th><td>${cs.length} 位（全數收錄），其中 ${plat.filter((n) => !n).length} 位尚無政見</td></tr>
            <tr><th>政見</th><td>${range(plat)} 則</td></tr>
            <tr><th>做過的事</th><td>${range(rec)} 則，其中 ${self} 則標註「本人說法」</td></tr>
            <tr><th>過去政見</th><td>${range(past)} 則</td></tr>
            <tr><th>附資料來源</th><td>${withSrc} / ${all.length} 則</td></tr>
            <tr><th>可行性評估</th><td>${feasN} / ${sum(plat)} 則政見已評估；總評分布：${dist(feas)}</td></tr>
          </table>`;
        if (!regions.has(race.region)) regions.set(race.region, { html: [], races: 0, cands: 0, plat: 0 });
        const g = regions.get(race.region);
        g.html.push(html); g.races++; g.cands += cs.length; g.plat += sum(plat);
      });

      $("total").innerHTML = `
        <table class="def">
          <tr><th>選區</th><td>${tot.races} 個</td></tr>
          <tr><th>候選人</th><td>${tot.cands} 位，其中 ${tot.empty} 位尚無政見</td></tr>
          <tr><th>政見</th><td>${tot.plat} 則</td></tr>
          <tr><th>可行性評估</th><td>${tot.feas} / ${tot.plat} 則</td></tr>
        </table>`;
      $("table").innerHTML = [...regions].map(([name, g]) => `
        <details class="stat-region">
          <summary>${esc(name)}<span class="muted">${g.races} 個選區・${g.cands} 位候選人・${g.plat} 則政見</span></summary>
          ${g.html.join("")}
        </details>`).join("");
      $("long-list").innerHTML = longByRace.length
        ? longByRace.map((r) => `<h3>${esc(r.name)}</h3><ul>${r.longs.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`).join("")
        : "<p>（尚無）</p>";
    })();
  </script>
