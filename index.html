<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盲選政見比較 · 2026 地方選舉</title>
  <meta name="description" content="隱藏候選人姓名、黨籍與照片，只看政見與做過的事，幫你在沒有成見的情況下找到最合適的候選人。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <span class="stamp logo-stamp" aria-hidden="true"></span>
      <div class="header-text">
        <p class="eyebrow">2026 地方選舉</p>
        <h1 class="brand">盲選政見比較</h1>
        <p class="tagline">不看名字、不看黨派、不看照片，只看政見與做過的事。<a class="method-link" href="methodology.html">方法與資料說明 →</a></p>
      </div>
      <div class="countdown" id="countdown" hidden></div>
      <!-- 投票箱插圖 -->
      <svg class="ballot-box" viewBox="0 0 100 92" aria-hidden="true">
        <g transform="rotate(-6 50 20)">
          <rect x="30" y="2" width="40" height="34" rx="2" fill="#fffdf8" stroke="#23211d" stroke-width="2"/>
          <line x1="36" y1="10" x2="52" y2="10" stroke="#e4ddcd" stroke-width="2"/>
          <line x1="36" y1="16" x2="48" y2="16" stroke="#e4ddcd" stroke-width="2"/>
          <image href="assets/vote-stamp.svg" x="52" y="9" width="14" height="14"/>
        </g>
        <rect x="8" y="30" width="84" height="58" rx="4" fill="#fffdf8" stroke="#23211d" stroke-width="2.5"/>
        <rect x="8" y="30" width="84" height="10" fill="#23211d"/>
        <rect x="28" y="33" width="44" height="4" rx="2" fill="#fbf8f1"/>
        <text x="50" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#d7262c" font-family="'Noto Sans TC','PingFang TC',sans-serif" letter-spacing="4">票匭</text>
      </svg>
    </div>
  </header>

  <nav class="steps wrap" aria-label="步驟">
    <button data-step="race"><span class="step-no">1</span>選擇選區</button>
    <button data-step="weights"><span class="step-no">2</span>議題重要度</button>
    <button data-step="browse"><span class="step-no">3</span>閱讀與圈選</button>
    <button data-step="result"><span class="step-no">4</span>開票</button>
  </nav>

  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="site-footer wrap">
    <p id="data-note"></p>
    <p><a href="methodology.html">方法與資料說明</a>：候選人收錄、政見整理、可行性評估的標準與資料限制。</p>
    <p>看清楚政見，再投下神聖的一票。你的評分只存在這台裝置的瀏覽器裡，不會上傳。候選人代號與順序每次重新洗牌都會隨機產生。</p>
    <p>圈選章圖示：<a href="https://commons.wikimedia.org/wiki/File:Elected_candidate_symbol_(voting_stamp,_Taiwan).svg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>（公有領域）。</p>
  </footer>

  <!-- 資料檔：data/sample.js 為虛構範例，可替換成其他選區資料 -->
  <script src="data/new-taipei.js"></script>
  <script src="data/new-taipei-council-03.js"></script>
  <script src="data/new-taipei-council-06.js"></script>
  <script src="data/new-taipei-feasibility.js"></script>
  <script src="app.js"></script>
</body>
</html>
